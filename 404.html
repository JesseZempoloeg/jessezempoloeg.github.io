<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagina niet gevonden — NOVA ARCADE</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060a" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --ink: #05060a;
        --cream: #f4efe6;
        --dim: rgba(244, 239, 230, 0.56);
        --accent: #ff3d9a;
        --honey: #e08a4c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 2rem;
        background:
          radial-gradient(900px 600px at 78% 8%, rgba(79, 140, 255, 0.16), transparent 68%),
          radial-gradient(800px 600px at 10% 105%, rgba(224, 138, 76, 0.14), transparent 70%),
          var(--ink);
        color: var(--cream);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-weight: 300;
        text-align: center;
      }
      main { position: relative; max-width: 34rem; }
      .orb {
        width: 132px;
        height: 132px;
        margin: 0 auto 2.2rem;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #ffd9b0, #f0a76a 30%, #a3522a 66%, #2a1208 100%);
        box-shadow: 0 0 90px rgba(224, 138, 76, 0.28);
        position: relative;
      }
      .orb::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 168%;
        height: 34%;
        transform: translate(-50%, -50%) rotate(-17deg);
        border: 2px solid rgba(244, 239, 230, 0.42);
        border-radius: 50%;
      }
      .eyebrow {
        margin: 0 0 0.9rem;
        font-size: 0.6rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--honey);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.7rem, 5vw, 2.8rem);
        line-height: 1.1;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      p { margin: 0 auto 2rem; max-width: 26rem; color: var(--dim); line-height: 1.7; }
      a {
        display: inline-block;
        padding: 0.95rem 1.9rem;
        border-radius: 2px;
        background: var(--accent);
        color: #14090a;
        font-size: 0.63rem;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        text-decoration: none;
        transition: transform 0.3s, box-shadow 0.3s;
      }
      a:hover { transform: translateY(-2px); box-shadow: 0 18px 46px -16px rgba(255, 61, 154, 0.9); }
      a.secondary {
        margin-left: 0.6rem;
        background: transparent;
        color: var(--cream);
        border: 1px solid rgba(244, 239, 230, 0.26);
      }
      @media (max-width: 420px) {
        a.secondary { margin: 0.7rem 0 0; display: block; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <p class="eyebrow">404 · NIET GEVONDEN</p>
      <h1>Deze pagina is de ruimte in</h1>
      <p>De link klopt niet meer, of de pagina bestaat nooit. Ga terug naar de arcade en kies een game.</p>
      <a href="/">NAAR DE GAMES</a>
      <a class="secondary" href="/over.html">OVER JESSE</a>
    </main>
  </body>
</html>
